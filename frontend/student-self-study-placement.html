<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Placement test — AI Self-Study Centre" />
    <title>Placement test — EAP Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/student-self-study.css" />

  <body class="page-app eap-shell-active" data-page="student-self-study-placement">
    <div id="page-shell" class="page-shell">
      <div class="page-overlay">
        <a class="skip-link" href="#main">Skip to content</a>
        <header class="site-header">
          <div class="site-header__inner">
            <a class="site-logo" href="student.html"
              ><span data-i18n="brand">EAP Platform</span
              ><span class="eap-build-badge" data-i18n="build_badge">Agent build</span></a
            >
            <div class="site-header__actions">
              <button type="button" id="lang-toggle" class="btn-lang" aria-label="Switch language">中文</button>
              <p class="site-welcome" id="header-welcome" aria-live="polite"><span data-i18n="welcome">Welcome,</span></p>
              <button type="button" class="btn-logout" id="logout-btn" data-i18n="logout">Logout</button>
            </div>
          </div>
        </header>
        <main id="main" class="app-main ssc-main">
          <div class="ssc-back-row">
            <a class="ssc-back-link" href="student-self-study.html" data-i18n="self_study_back_hub">← AI Self-Study Centre</a>

          <div class="ssc-hero">
            <h1 data-i18n="self_study_placement_page_title">Practice placement test</h1>
            <p class="ssc-hero__lead" data-i18n="self_study_placement_page_lead">
              About 20 minutes · four parts · demo only
            </p>
          </div>

          <div class="ssc-placement-progress" aria-live="polite">
            <div class="ssc-placement-progress__bar">
              <div id="ssc-placement-progress-fill" class="ssc-placement-progress__fill" style="width: 0%"></div>
            </div>
            <p id="ssc-placement-progress-label" class="ssc-placement-progress__label" data-i18n="self_study_placement_progress_intro">
              Ready to begin
            </p>
          </div>

          <div id="ssc-placement-root"></div>
        </main>
      </div>
    </div>
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/zh.js"></script>
    <script src="js/i18n-core.js"></script>
    <script src="api-config.js"></script>
