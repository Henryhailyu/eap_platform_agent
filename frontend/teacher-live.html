<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teacher Live Teaching — EAP Platform" />
    <title>Live Teaching — EAP Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/teacher-live.css?v=20260626-resp-loading" />
    <link rel="stylesheet" href="css/eap-ai-busy.css?v=20260602-ux3" />
    <link rel="stylesheet" href="css/teacher-lesson-ai.css" />
  </head>
  <body class="page-app eap-shell-active" data-page="teacher-live">
    <div id="page-shell" class="page-shell">
      <div class="page-overlay">
        <a class="skip-link" href="#tlive-main">Skip to content</a>
        <header class="site-header">
          <div class="site-header__inner">
            <a class="site-logo" href="teacher.html"
              ><span data-i18n="brand">EAP Platform</span
              ><span class="eap-build-badge" data-i18n="build_badge">Agent build</span></a
            >
            <div class="site-header__actions">
              <button type="button" id="lang-toggle" class="btn-lang" aria-label="Switch language">中文</button>
              <p class="site-welcome" id="header-welcome" aria-live="polite"><span data-i18n="welcome">Welcome,</span></p>
              <button type="button" class="btn-logout" id="logout-btn" data-i18n="logout">Logout</button>
            </div>
          </div>
        </header>

        <div class="tlive-page" id="tlive-main">
          <div class="tlive-topbar">
            <div>
              <a id="tlive-back" class="tlive-back" href="teacher.html" data-i18n="tlive_back_calendar">← Teaching calendar</a>
              <h1 id="tlive-session-title">Live Teaching</h1>
              <p id="tlive-session-meta" class="tlive-topbar__meta">—</p>
              <div id="tlive-session-join" class="tlive-session-join hidden" hidden>
                <p class="tlive-session-join__label" data-i18n="tlive_join_label">Students join at:</p>
                <p class="tlive-session-join__code">
                  <span data-i18n="tlive_join_code">Code</span>
                  <strong id="tlive-session-code">——</strong>
                </p>
                <a id="tlive-join-link" class="tlive-session-join__link" href="student-live.html" target="_blank" rel="noopener"></a>
              </div>
              <p id="tlive-launch-status" class="tlive-launch-status hidden" role="status" aria-live="polite"></p>
            </div>
          </div>

          <div class="tlive-body">
            <nav class="tlive-toolbar" aria-label="Classroom tools">
              <button type="button" class="tlive-tool tlive-tool--active" data-tool="slides" title="Slides">
                <span class="tlive-tool__icon" aria-hidden="true">📑</span>
                <span data-i18n="tlive_tool_slides">Slides</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="upload" title="Upload">
                <span class="tlive-tool__icon" aria-hidden="true">📤</span>
                <span data-i18n="tlive_tool_upload">Upload</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="poll" title="Poll">
                <span class="tlive-tool__icon" aria-hidden="true">📊</span>
                <span data-i18n="tlive_tool_poll">Poll</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="quiz" title="Quiz">
                <span class="tlive-tool__icon" aria-hidden="true">❓</span>
                <span data-i18n="tlive_tool_quiz">Quiz</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="games" title="Class activity">
                <span class="tlive-tool__icon" aria-hidden="true">📋</span>
                <span data-i18n="tlive_tool_games">Class activity</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="wheel" title="Name wheel">
                <span class="tlive-tool__icon" aria-hidden="true">🎡</span>
                <span data-i18n="tlive_tool_wheel">Name wheel</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="timer" title="Timer">
                <span class="tlive-tool__icon" aria-hidden="true">⏱</span>
                <span data-i18n="tlive_tool_timer">Timer</span>
              </button>
              <button type="button" class="tlive-tool" data-tool="ai" title="AI">
                <span class="tlive-tool__icon" aria-hidden="true">✨</span>
                <span data-i18n="tlive_tool_ai">AI</span>
              </button>
            </nav>

            <div class="tlive-canvas-wrap" id="tlive-canvas-wrap">
              <section class="tlive-canvas" aria-label="Teaching display">
                <div id="tlive-canvas-inner" class="tlive-canvas__inner"></div>
              </section>
              <aside id="tlive-tool-panel" class="tlive-tool-panel hidden" aria-label="Poll and quiz controls" hidden></aside>
            </div>

            <aside class="tlive-display-library" aria-labelledby="tlive-display-library-heading">
              <h2 id="tlive-display-library-heading" class="tlive-display-library__title" data-i18n="tlive_display_library">Display library</h2>
              <p class="tlive-display-library__hint" data-i18n="tlive_display_library_hint">Prepare HTML lessons and files for this class. They stay here until you delete them.</p>
              <input id="tlive-display-file-input" type="file" class="hidden" multiple accept=".pdf,.ppt,.pptx,.doc,.docx,.txt" />
              <button type="button" class="btn-secondary btn-small" id="tlive-display-upload-btn" data-i18n="tlive_display_upload">Upload file</button>
              <ul id="tlive-display-list" class="tlive-display-list" aria-live="polite"></ul>
            </aside>
          </div>
        </div>
      </div>
    </div>

    <div id="tlive-responses-modal" class="tlive-responses-modal hidden" role="dialog" aria-modal="true" aria-labelledby="tlive-responses-modal-title" hidden>
      <div class="tlive-responses-modal__backdrop" data-close-modal aria-hidden="true"></div>
      <div class="tlive-responses-modal__card">
        <header class="tlive-responses-modal__head">
          <h2 id="tlive-responses-modal-title" data-i18n="tlive_panel_responses">Student responses</h2>
          <button type="button" id="tlive-responses-modal-close" class="tlive-float__close" aria-label="Close">×</button>
        </header>
        <div id="tlive-responses-modal-body" class="tlive-responses-modal__body"></div>
        <footer id="tlive-responses-modal-foot" class="tlive-responses-modal__foot"></footer>
      </div>
    </div>
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/zh.js"></script>
    <script src="js/i18n-core.js"></script>
    <script src="js/pilot-wake.js"></script>
    <script src="js/site-icp-footer.js"></script>
    <script src="api-config.js"></script>
    <script src="app.js"></script>
    <script src="js/live-teaching-api.js?v=20260626-game-vocab"></script>
    <script src="js/teacher-live-mock.js"></script>
    <script src="js/teacher-name-wheel.js"></script>
    <script src="js/eap-live-timer-shared.js?v=20260603-sync"></script>
    <script src="js/teacher-live-timer.js?v=20260603-push"></script>
    <script src="js/teacher-teaching-pages-api.js"></script>
    <script src="js/teacher-lesson-ai.js?v=20260623-live-sync-v10"></script>
    <script src="js/eap-html-bridge.js"></script>
    <script src="js/eap-live-lesson-slots.js?v=20260623-live-sync-v10"></script>
    <script src="js/teacher-live-poll-quiz.js?v=20260623-live-sync-v10"></script>
    <script src="js/teacher-live-game-questions.js?v=20260623-live-sync-v10"></script>
    <script src="js/teacher-live-game-vocab.js?v=20260623-live-sync-v10"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
    <script src="js/eap-file-viewer.js"></script>
    <script src="js/eap-saved-datetime.js?v=20260602-ux3"></script>
    <script src="js/eap-ai-busy.js?v=20260602-ux3"></script>
    <script src="js/classroom-display-api.js?v=20260623-live-sync-v10"></script>
    <script src="js/teacher-live.js?v=20260623-live-sync-v10"></script>
  </body>
</html>
