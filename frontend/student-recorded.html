<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recorded lessons — EAP Platform" />
    <title>Recorded lessons — EAP Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/student-recorded.css" />
  </head>
  <body class="page-app eap-shell-active" data-page="student-recorded">
    <div id="page-shell" class="page-shell">
      <div class="page-overlay">
        <header class="site-header">
          <div class="site-header__inner">
            <a class="site-logo" href="student.html"
              ><span data-i18n="brand">EAP Platform</span
              ><span class="eap-build-badge" data-i18n="build_badge">Agent build</span></a
            >
            <div class="site-header__actions">
              <button type="button" id="lang-toggle" class="btn-lang" aria-label="Switch language">中文</button>
              <p class="site-welcome" id="header-welcome" aria-live="polite"><span data-i18n="welcome">Welcome,</span></p>
              <button type="button" class="btn-logout" id="logout-btn" data-i18n="logout">Logout</button>
            </div>
          </div>
        </header>
        <main id="main" class="app-main srec-main">
          <a class="srec-back" href="student.html" data-i18n="srec_back_calendar">← Calendar Learning Centre</a>
          <div class="srec-hero">
            <h1 data-i18n="srec_list_title">Recorded lessons</h1>
            <p class="srec-hero__lead" data-i18n="srec_list_lead">
              Watch class recordings your teacher has published. Playback stays inside EAP — no download.
            </p>
          </div>
          <p id="srec-error" class="srec-error hidden" role="alert"></p>

          <nav class="srec-month-nav" aria-label="Month navigation">
            <button type="button" id="srec-prev-month" class="btn-secondary srec-month-nav__btn" data-i18n="srec_prev_month">← Previous month</button>
            <span id="srec-month-label" class="srec-month-nav__label" aria-live="polite"></span>
            <button type="button" id="srec-next-month" class="btn-secondary srec-month-nav__btn" data-i18n="srec_next_month">Next month →</button>
          </nav>

          <p id="srec-empty" class="srec-empty hidden" role="status" aria-live="polite"></p>
          <div id="srec-list" class="srec-list"></div>
        </main>
      </div>
    </div>
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/zh.js"></script>
    <script src="js/i18n-core.js"></script>
    <script src="js/pilot-wake.js"></script>
    <script src="js/site-icp-footer.js"></script>
    <script src="api-config.js"></script>
    <script src="app.js?v=20260601-student-rec-fix2"></script>
    <script src="js/recorded-lessons-api.js?v=20260601-student-rec-fix2"></script>
    <script src="js/student-recorded.js?v=20260601-student-rec-fix2"></script>
  </body>
</html>
