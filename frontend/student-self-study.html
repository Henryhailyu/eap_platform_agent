<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Self-Study Centre — EAP Platform" />
    <title>AI Self-Study Centre — EAP Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/student-self-study.css" />
  </head>
  <body class="page-app eap-shell-active" data-page="student-self-study" data-ss-hub="20260609-v3">
    <div id="page-shell" class="page-shell">
      <div class="page-overlay">
        <a class="skip-link" href="#main">Skip to content</a>
        <header class="site-header">
          <div class="site-header__inner">
            <a class="site-logo" href="student.html"
              ><span data-i18n="brand">EAP Platform</span
              ><span class="eap-build-badge" data-i18n="build_badge">Agent build</span></a
            >
            <div class="site-header__actions">
              <button type="button" id="lang-toggle" class="btn-lang" aria-label="Switch language">中文</button>
              <p class="site-welcome" id="header-welcome" aria-live="polite"><span data-i18n="welcome">Welcome,</span></p>
              <button type="button" class="btn-logout" id="logout-btn" data-i18n="logout">Logout</button>
            </div>
          </div>
        </header>
        <main id="main" class="app-main ssc-main ssc-main--hub">
          <div class="ssc-back-row">
            <a class="ssc-back-link" href="student.html" data-i18n="self_study_back_calendar">← Calendar Learning Centre</a>
            <span id="ssc-level-badge" class="ssc-level-badge" hidden aria-live="polite"></span>
          </div>

          <div class="ssc-hero ssc-hero--compact">
            <h1 data-i18n="self_study_hub_title">AI Self-Study Centre</h1>
            <p class="ssc-hero__lead" data-i18n="self_study_hub_cal_lead">
              Tap a date to open Channel A or B tasks for that day.
            </p>
          </div>

          <section class="ssc-hub-calendar" aria-labelledby="ssc-cal-heading">
            <h2 id="ssc-cal-heading" class="visually-hidden" data-i18n="self_study_vocab_tab_calendar">Calendar</h2>
            <div id="ssc-cal-root" class="ssc-cal-shell"></div>
          </section>

          <section id="ssc-day-panel" class="ssc-hub-day-panel" hidden aria-live="polite"></section>

          <p id="ssc-retake-wrap" class="ssc-retake ssc-retake--hub">
            <button type="button" id="ssc-retake-btn" class="ssc-retake__link" data-i18n="self_study_retake">Retake placement test</button>
          </p>
        </main>
      </div>
    </div>
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/zh.js"></script>
    <script src="js/i18n-core.js"></script>
    <script src="js/pilot-wake.js"></script>
    <script src="api-config.js"></script>
    <script src="app.js"></script>
    <script src="js/student-self-study-server.js?v=20260610-v3"></script>
    <script src="js/student-self-study-mock.js"></script>
    <script src="js/student-self-study-hub.js?v=20260611-a2"></script>
    <script src="js/student-self-study.js?v=20260609-v3"></script>
  </body>
</html>
