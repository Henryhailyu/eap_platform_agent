# Phase G — local pilot stack (mirrors production layout with a persistent /data volume)
services:
  eap:
    build: .
    env_file:
      - .env
    ports:
      - "5051:5051"
    environment:
      EAP_ENV: production
      EAP_PILOT_MODE: "1"
      EAP_PRODUCTION_PRESET: "1"
      EAP_TRUST_PROXY: "1"
      EAP_SECRET_KEY: ${EAP_SECRET_KEY:-replace-me-before-public-pilot}
      EAP_PUBLIC_URL: ${EAP_PUBLIC_URL:-http://localhost:5051}
      EAP_PILOT_DEFAULT_PASSWORD: ${EAP_PILOT_DEFAULT_PASSWORD:-}
      EAP_SESSION_COOKIE_SECURE: ${EAP_SESSION_COOKIE_SECURE:-0}
      EAP_AI_ENABLED: ${EAP_AI_ENABLED:-0}
      EAP_AI_PROVIDER: ${EAP_AI_PROVIDER:-openai}
      EAP_AI_MODEL: ${EAP_AI_MODEL:-}
      EAP_OPENAI_API_KEY: ${EAP_OPENAI_API_KEY:-}
      EAP_OPENAI_BASE_URL: ${EAP_OPENAI_BASE_URL:-}
      EAP_OPENAI_MODEL: ${EAP_OPENAI_MODEL:-}
      EAP_DEEPSEEK_API_KEY: ${EAP_DEEPSEEK_API_KEY:-}
      EAP_DEEPSEEK_BASE_URL: ${EAP_DEEPSEEK_BASE_URL:-}
      EAP_DEEPSEEK_MODEL: ${EAP_DEEPSEEK_MODEL:-}
      EAP_AUDIO_ENABLED: ${EAP_AUDIO_ENABLED:-0}
      EAP_TENCENT_SECRET_ID: ${EAP_TENCENT_SECRET_ID:-}
      EAP_TENCENT_SECRET_KEY: ${EAP_TENCENT_SECRET_KEY:-}
      EAP_TENCENT_APP_ID: ${EAP_TENCENT_APP_ID:-}
      EAP_TENCENT_REGION: ${EAP_TENCENT_REGION:-ap-shanghai}
      EAP_COS_BUCKET: ${EAP_COS_BUCKET:-}
      EAP_COS_REGION: ${EAP_COS_REGION:-ap-shanghai}
      EAP_COS_AUDIO_PREFIX: ${EAP_COS_AUDIO_PREFIX:-self-study/}
      EAP_TTS_ENABLED: ${EAP_TTS_ENABLED:-0}
      EAP_TTS_VOICE_ID: ${EAP_TTS_VOICE_ID:-}
      EAP_TTS_SAMPLE_RATE: ${EAP_TTS_SAMPLE_RATE:-16000}
      EAP_TTS_CODEC: ${EAP_TTS_CODEC:-mp3}
      EAP_ASR_ENABLED: ${EAP_ASR_ENABLED:-0}
      EAP_ASR_ENGINE: ${EAP_ASR_ENGINE:-16k_en}
      EAP_SOE_ENABLED: ${EAP_SOE_ENABLED:-0}
      EAP_SOE_APP_ID: ${EAP_SOE_APP_ID:-}
      EAP_SOE_ENGINE: ${EAP_SOE_ENGINE:-16k_en}
      EAP_SPEAKING_AUDIO_RETENTION_DAYS: ${EAP_SPEAKING_AUDIO_RETENTION_DAYS:-90}
      EAP_SEED_PILOT: "1"
      EAP_SEED_DEMO_TASKS: "1"
      PORT: "5051"
    volumes:
      - eap_data:/data
    restart: unless-stopped

volumes:
  eap_data:
